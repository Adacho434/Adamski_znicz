<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pamiętamy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    color: white;
    background: radial-gradient(circle at center, #273142 0%, #151922 45%, #080a0f 100%);
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px;
    background-position: 0 0, 30px 50px;
    opacity: 0.25;
}

.content {
    position: relative;
    z-index: 2;
    text-align: center;
}

h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: normal;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(255, 190, 80, 0.4);
}

.quote {
    max-width: 600px;
    margin: 0 auto 45px;
    padding: 0 20px;
    color: #d5d5d5;
    font-size: clamp(1rem, 2vw, 1.3rem);
    line-height: 1.6;
    font-style: italic;
}

.candle {
    position: relative;
    width: 180px;
    height: 290px;
    margin: auto;
}

.glow {
    position: absolute;
    width: 230px;
    height: 230px;
    left: 50%;
    top: -85px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 170, 30, 0.28) 0%,
        rgba(255, 120, 0, 0.12) 35%,
        transparent 70%
    );
    animation: glow 2s infinite alternate;
}

.flame {
    position: absolute;
    width: 58px;
    height: 95px;
    left: 50%;
    top: -15px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    background: linear-gradient(
        to top,
        #ff4500 0%,
        #ff7800 35%,
        #ffd23f 70%,
        #fff3a0 100%
    );
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    clip-path: polygon(
        50% 0%,
        72% 28%,
        92% 58%,
        76% 100%,
        24% 100%,
        8% 58%,
        28% 28%
    );
    box-shadow:
        0 0 15px #ff8c00,
        0 0 35px #ff5e00,
        0 0 60px rgba(255, 100, 0, 0.7);
    animation: flicker 1.4s ease-in-out infinite alternate;
}

.flame::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 55px;
    bottom: 10px;
    left: 15px;
    background: linear-gradient(
        to top,
        #fff 0%,
        #fff7b0 45%,
        #ffb000 100%
    );
    border-radius: 50%;
    clip-path: polygon(
        50% 0%,
        80% 40%,
        70% 100%,
        30% 100%,
        20% 40%
    );
    animation: inner-flame 1s infinite alternate;
}

.top {
    position: absolute;
    width: 145px;
    height: 42px;
    left: 17px;
    top: 65px;
    background: linear-gradient(
        to bottom,
        #555 0%,
        #222 35%,
        #555 65%,
        #111 100%
    );
    border-radius: 50% 50% 20% 20%;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);
}

.top::before {
    content: "";
    position: absolute;
    width: 55px;
    height: 20px;
    left: 45px;
    top: -10px;
    background: #303030;
    border-radius: 50% 50% 0 0;
}

.glass {
    position: absolute;
    width: 150px;
    height: 180px;
    left: 15px;
    top: 95px;
    border-radius: 12px 12px 28px 28px;
    background: linear-gradient(
        90deg,
        rgba(80, 80, 85, 0.9),
        rgba(190, 190, 190, 0.35) 25%,
        rgba(100, 100, 105, 0.45) 55%,
        rgba(35, 35, 40, 0.9)
    );
    border: 2px solid rgba(220, 220, 220, 0.25);
    box-shadow:
        inset 15px 0 20px rgba(255, 255, 255, 0.08),
        inset -15px 0 20px rgba(0, 0, 0, 0.45),
        0 20px 25px rgba(0, 0, 0, 0.7);
}

.glass::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 130px;
    left: 38px;
    bottom: 10px;
    border-radius: 50%;
    background: radial-gradient(
        ellipse,
        rgba(255, 180, 40, 0.35),
        rgba(255, 90, 0, 0.08),
        transparent 70%
    );
    animation: candle-light 1.5s infinite alternate;
}

.base {
    position: absolute;
    width: 175px;
    height: 28px;
    bottom: 0;
    left: 2px;
    border-radius: 50%;
    background: linear-gradient(
        to bottom,
        #555,
        #171717 55%,
        #050505
    );
    box-shadow:
        0 8px 15px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(255, 120, 0, 0.15);
}

.memory {
    margin-top: 45px;
    font-size: 1rem;
    color: #aaa;
    letter-spacing: 1px;
}

@keyframes flicker {
    0% {
        transform: translateX(-50%) rotate(-3deg) scale(0.95, 1.05);
    }

    25% {
        transform: translateX(-50%) rotate(3deg) scale(1.04, 0.96);
    }

    50% {
        transform: translateX(-50%) rotate(-1deg) scale(0.98, 1.03);
    }

    75% {
        transform: translateX(-50%) rotate(4deg) scale(1.03, 0.97);
    }

    100% {
        transform: translateX(-50%) rotate(-4deg) scale(0.96, 1.04);
    }
}

@keyframes inner-flame {
    from {
        transform: translateY(2px) scale(0.9);
        opacity: 0.85;
    }

    to {
        transform: translateY(-2px) scale(1.1);
        opacity: 1;
    }
}

@keyframes glow {
    from {
        transform: translateX(-50%) scale(0.9);
        opacity: 0.6;
    }

    to {
        transform: translateX(-50%) scale(1.15);
        opacity: 1;
    }
}

@keyframes candle-light {
    from {
        opacity: 0.5;
        transform: scale(0.95);
    }

    to {
        opacity: 0.9;
        transform: scale(1.08);
    }
}

@media (max-height: 700px) {
    .quote {
        margin-bottom: 20px;
    }

    .memory {
        margin-top: 20px;
    }

    .candle {
        transform: scale(0.85);
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<main class="content">
    <h1>Pamiętamy</h1>

    <p class="quote">
        „Człowiek odchodzi, lecz wspomnienia pozostają
        i płoną w naszych sercach jak wieczny płomień.”
    </p>

    <div class="candle">
        <div class="glow"></div>
        <div class="flame"></div>
        <div class="top"></div>
        <div class="glass"></div>
        <div class="base"></div>
    </div>

    <p class="memory">
        W ciszy wspominamy tych, którzy pozostali w naszych sercach.
        Praca wykonana przez Kubę Adamskiego.
    </p>
</main>

</body>
</html>
